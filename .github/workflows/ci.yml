name: Python validation
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python ember_simulation.py --verify
      - name: Recompute USDA aggregate benchmark using frozen groups
        run: |
          python train_distance_benchmarks.py \
            --data data/processed/canonical_particle_distance.csv \
            --split data/manifests/split_v1.csv \
            --outdir ci_benchmark
      - name: Save benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: usda-run-level-benchmark
          path: |
            ci_benchmark/benchmark_comparison.json
            ci_benchmark/group_cv_metrics.csv
            ci_benchmark/test_predictions.csv
          retention-days: 14
